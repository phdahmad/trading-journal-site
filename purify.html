<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>التطهير</title>
<link rel="stylesheet" href="assets/style.css?v=105543cd">
<style>
  .pur-hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; margin-bottom: 16px; }
  .pur-main { padding: 22px; }
  .pur-main .hero-value { color: var(--accent); }
  .pur-main .hero-value.done { color: var(--gain); }
  .meter { height: 10px; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; margin-top: 14px; }
  .meter > span { display: block; height: 100%; background: var(--gain); border-radius: 999px; }
  .meter-legend { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; margin-top: 6px; }
  .rule-note { color: var(--ink-2); font-size: 14px; margin: 0; }
  .how { display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }
  .how code { font-family: var(--text); background: var(--surface-2); border: 1px solid var(--rule); border-radius: 6px; padding: 1px 8px; color: var(--ink); }
  tfoot td { font-weight: 700; border-top: 1px solid var(--rule-strong); border-bottom: 0; }
  @media (max-width: 860px) { .pur-hero { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { tfoot { display: none; } }
</style>
</head>
<body>
<header class="masthead" data-masthead></header>
<main id="app"><p class="muted">جارٍ التحميل…</p></main>
<footer class="foot" data-foot></footer>
<script src="assets/app.js?v=105543cd"></script>
<script>
(function () {
  const T = window.TJ;
  T.chrome("purify");
  T.load(({ meta, trades, purification: P }) => {
    const app = document.getElementById("app");
    const ratePct = (r) => T.num(T.nf2.format(r * 100).replace(/\.00$/, "") + "%");
    if (!P || !P.rate) {
      app.innerHTML = `<div class="page-head"><h1>التطهير</h1></div><div class="card empty"><h2>لم تُحدد نسبة التطهير بعد</h2><p>أخبر Claude بالنسبة التي تريد إخراجها من كل ربح، وتظهر هنا تلقائياً.</p></div>`;
      return;
    }
    const order = { unpaid: 0, partial: 1, paid: 2 };
    const wins = trades.filter((t) => t.purify > 0.004).sort((a, b) => (order[a.purifyState] - order[b.purifyState]) || String(b.lastSell || b.buy.date).localeCompare(String(a.lastSell || a.buy.date)));
    const pending = wins.filter((t) => t.purifyState !== "paid");
    const stateCell = (t) => t.purifyState === "paid" ? `<span class="pill win">مُخرج</span>`
      : t.purifyState === "partial" ? `<span class="pill partial">متبقٍ ${T.money(t.purifyLeft)}</span>` : `<span class="pill open">لم يُخرج</span>`;
    const left = P.left, done = left <= 0.004;
    const pctPaid = P.due > 0 ? Math.min(100, (P.paid / P.due) * 100) : 0;
    const k = (label, value, foot) => `<div class="card kpi"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${foot ? `<div class="kpi-foot">${foot}</div>` : ""}</div>`;

    app.innerHTML = `
      <div class="page-head"><h1>التطهير</h1><div class="updated">${ratePct(P.rate)} من ربح كل صفقة رابحة</div></div>
      <section class="pur-hero">
        <div class="card pur-main">
          <div class="hero-label">${done ? "لا يوجد مبلغ متبقٍ" : "المتبقي عليك إخراجه"}</div>
          <div class="hero-value ${done ? "done" : ""}">${T.money(Math.max(0, left))}<span class="cur">${T.cur}</span></div>
          <div class="meter" role="img" aria-label="نسبة ما أُخرج من المستحق"><span style="inline-size:${pctPaid.toFixed(1)}%"></span></div>
          <div class="meter-legend"><span>أُخرج ${T.num(T.nf2.format(pctPaid).replace(/\.00$/, "") + "%")} من المستحق</span><span>${left < -0.004 ? `زيادة مُخرجة ${T.money(-left)}` : ""}</span></div>
        </div>
        <div class="kpis">
          ${k("إجمالي المستحق", T.money(P.due), `من ${T.num(wins.length)} ${wins.length === 1 ? "صفقة رابحة" : "صفقات رابحة"}`)}
          ${k("ما أخرجته", T.money(P.paid), `${T.num(P.payments.length)} ${P.payments.length === 1 ? "دفعة" : "دفعات"}`)}
        </div>
      </section>

      <section class="grid-2">
        <div class="card">
          <div class="card-head"><h2>المستحق من كل صفقة</h2><span class="hint">${pending.length ? `${T.num(pending.length)} ${pending.length === 1 ? "صفقة" : "صفقات"} بانتظار الإخراج` : "كل الصفقات مُخرج تطهيرها"}</span></div>
          <div class="card-body">
            <div class="chips" role="group" aria-label="حالة الإخراج" style="display:inline-flex;margin-bottom:10px">
              <button data-f="pending" aria-pressed="false">لم يُخرج</button>
              <button data-f="paid" aria-pressed="false">مُخرج</button>
              <button data-f="all" aria-pressed="false">الكل</button>
            </div>
            <div class="table-wrap" id="due"></div>
          </div>
        </div>
        <div class="stack">
          <div class="card">
            <div class="card-head"><h2>ما أخرجته</h2></div>
            <div class="card-body" id="paid"></div>
          </div>
          <div class="card">
            <div class="card-head"><h2>طريقة الحساب</h2></div>
            <div class="card-body how">
              <p class="rule-note">${T.esc(P.basis || "")}</p>
              <p class="rule-note">الصفقات الخاسرة لا يُحسب عليها تطهير، ولا تُخصم من المستحق.</p>
              <p class="rule-note">ما تُخرجه يُوزَّع على الصفقات بالأقدم أولاً، فتظهر حالة كل صفقة: مُخرج، أو متبقٍ جزء منه، أو لم يُخرج.</p>
              <p class="rule-note">عند الإخراج أرسل لـ Claude مثلاً: <code>أخرجت 100 دولار تطهير</code> فيُسجَّل وينقص من المتبقي.</p>
            </div>
          </div>
        </div>
      </section>`;

    const renderDue = (f) => {
    app.querySelectorAll("[data-f]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.f === f));
    const rows = wins.filter((t) => f === "all" || (f === "paid" ? t.purifyState === "paid" : t.purifyState !== "paid"));
    const sumLeft = rows.reduce((a, t) => a + t.purifyLeft, 0);
    document.getElementById("due").innerHTML = rows.length ? `<table class="responsive"><thead><tr>
        <th>الصفقة</th><th>تاريخ البيع</th><th class="n">الربح</th><th class="n">النسبة</th><th class="n">التطهير</th><th>الحالة</th></tr></thead><tbody>` +
      rows.map((t) => `<tr class="link" data-href="${T.tradeHref(t.id)}">
        <td class="head-cell"><div class="hc">${T.symCell(t)}<span class="tid">${T.num(T.esc(t.id))}</span></div></td>
        <td data-label="تاريخ البيع">${T.fmtShort(t.lastSell)}</td>
        <td class="n" data-label="الربح">${T.signedMoney(t.realized)}</td>
        <td class="n" data-label="النسبة">${ratePct(t.purifyRate)}</td>
        <td class="n" data-label="التطهير"><b>${T.money(t.purify)}</b></td>
        <td data-label="الحالة">${stateCell(t)}</td></tr>`).join("") +
      `</tbody><tfoot><tr><td colspan="2">${f === "all" ? "الإجمالي" : f === "paid" ? "إجمالي المُخرج" : "إجمالي المتبقي"}</td><td class="n">${T.signedMoney(rows.reduce((a, t) => a + t.realized, 0))}</td><td></td><td class="n">${T.money(f === "pending" ? sumLeft : rows.reduce((a, t) => a + t.purify, 0))}</td><td></td></tr></tfoot></table>`
      : `<div class="mini-empty">${f === "pending" ? "لا توجد صفقات بانتظار الإخراج. تقبّل الله." : f === "paid" ? "لم يُخرج تطهير أي صفقة بعد." : "لا توجد صفقات رابحة بعد."}</div>`;
    app.querySelectorAll("#due tr[data-href]").forEach((r) => r.addEventListener("click", () => (location.href = r.dataset.href)));
    };
    app.querySelectorAll("[data-f]").forEach((b) => b.addEventListener("click", () => renderDue(b.dataset.f)));
    renderDue(pending.length ? "pending" : "all");

    document.getElementById("paid").innerHTML = P.payments.length ? P.payments.map((x, i, a) =>
      `<div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:9px 0;${i < a.length - 1 ? "border-bottom:1px solid var(--rule)" : ""}">
        <div><div>${x.date ? T.fmtDate(x.date) : "تاريخ غير محدد"}</div>${x.note ? `<div class="muted" style="font-size:13px;line-height:1.5">${T.esc(x.note)}</div>` : ""}</div>
        <b class="gain" style="white-space:nowrap">${T.money(+x.amount || 0)} ${T.cur}</b></div>`).join("")
      : `<div class="mini-empty">لم يُسجَّل أي إخراج بعد.</div>`;

  });
})();
</script>
</body>
</html>
